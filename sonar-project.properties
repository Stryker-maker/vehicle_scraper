# SonarQube Cloud project identity
sonar.organization=stryker-maker
sonar.projectKey=Stryker-maker_vehicle_scraper
sonar.projectName=vehicle_scraper

# Repository runtime
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11

# This repository keeps production Python modules at the repository root
# and test code under tests/.
sonar.sources=.
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py

# Exclude generated data, configuration/documentation artifacts, and CI/agent
# metadata from the production-source analysis scope. GitHub Actions workflows
# are intentionally NOT excluded so Sonar can analyze repository automation.
sonar.exclusions=.amazonq/**,data/**,tests/**,**/*.json,**/*.csv,**/*.md,**/*.txt,**/*.lock

# Test boilerplate is intentionally repetitive; do not let it dominate
# duplication metrics. Python coverage is generated by the Sonar workflow
# from the repository's canonical unittest suite.
sonar.cpd.exclusions=tests/**
sonar.python.coverage.reportPaths=coverage.xml
