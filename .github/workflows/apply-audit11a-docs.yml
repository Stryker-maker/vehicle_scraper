name: Apply Audit 11A Docs

on:
  pull_request:
    paths:
      - 'apply_audit11a_docs.py'
      - '.github/workflows/apply-audit11a-docs.yml'

permissions:
  contents: write

jobs:
  apply:
    name: Apply Audit 11A authorities
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout Audit 11A branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ai/audit-11a-f150-manual-reintroduction

      - name: Set up Python 3.11.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.13'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install exact locked dependencies
        run: |
          python dependency_lock.py --lock requirements.lock
          python -m pip install --disable-pip-version-check pip==25.1.1
          python -m pip install --disable-pip-version-check --requirement requirements.lock
          python -m pip check

      - name: Apply authority updates
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apply_audit11a_docs.py')
          text = path.read_text(encoding='utf-8')

          old_readme = 'Do not use `data/<vehicle>/merged/*.csv` as current recommendations.\n\'\'\','
          new_readme = 'Do not use `data/<vehicle>/merged/*.csv` as current recommendations. Historical merged CSVs are disabled legacy output and are deleted for active vehicles by governed retention with SHA-256 deletion evidence.\n\'\'\','
          if text.count(old_readme) != 2:
              raise RuntimeError(f'Expected two README anchor fragments, found {text.count(old_readme)}')
          text = text.replace(old_readme, new_readme)

          helper_anchor = '    path.write_text(text.replace(old, new), encoding="utf-8")\n\n\nreadme = ROOT / "README.md"'
          helper_replacement = '''    path.write_text(text.replace(old, new), encoding="utf-8")


def replace_first(path: Path, old: str, new: str) -> None:
    text = path.read_text(encoding="utf-8")
    if old not in text:
        raise RuntimeError(
            f"Expected at least one match in {path}; anchor={old.splitlines()[0]!r}"
        )
    path.write_text(text.replace(old, new, 1), encoding="utf-8")


readme = ROOT / "README.md"'''
          if text.count(helper_anchor) != 1:
              raise RuntimeError(f'Expected one helper anchor, found {text.count(helper_anchor)}')
          text = text.replace(helper_anchor, helper_replacement)

          old_test = '''replace_once(
              test,
              '            "AUDIT_10_SECONDARY_PURPOSE_OUTPUTS.md",\\n',
              '            "AUDIT_10_SECONDARY_PURPOSE_OUTPUTS.md",\\n            "AUDIT_11A_F150_MANUAL_REINTRODUCTION.md",\\n',
          )'''.replace('              ', '    ')
          new_test = '''replace_first(
              test,
              '            "AUDIT_09_F350_BUYER_INTELLIGENCE.md",\\n            "AUDIT_10_SECONDARY_PURPOSE_OUTPUTS.md",\\n',
              '            "AUDIT_09_F350_BUYER_INTELLIGENCE.md",\\n            "AUDIT_10_SECONDARY_PURPOSE_OUTPUTS.md",\\n            "AUDIT_11A_F150_MANUAL_REINTRODUCTION.md",\\n',
          )'''.replace('              ', '    ')
          if text.count(old_test) != 1:
              raise RuntimeError(f'Expected one authority-list call, found {text.count(old_test)}')
          path.write_text(text.replace(old_test, new_test), encoding='utf-8')
          PY
          set +e
          python apply_audit11a_docs.py 2>&1 | tee "$RUNNER_TEMP/audit11a-docs.log"
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Upload authority failure log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audit11a-docs-failure-${{ github.run_id }}
          path: ${{ runner.temp }}/audit11a-docs.log
          if-no-files-found: error
          retention-days: 3

      - name: Validate complete repository
        run: |
          python -m unittest discover -s tests -p 'test*.py'
          git diff --check
          git diff --stat

      - name: Commit authorities to Audit 11A branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            README.md \
            docs/AUDIT_ROADMAP.md \
            docs/VEHICLE_PURPOSES.md \
            docs/REPOSITORY_BASELINE.md \
            docs/LIMITATIONS_REGISTER.md \
            tests/test_documentation_contract.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No Audit 11A authority changes to commit."
            exit 0
          fi
          git commit -m "Align authorities with manual F-150 cadence"
          git push origin HEAD:ai/audit-11a-f150-manual-reintroduction
