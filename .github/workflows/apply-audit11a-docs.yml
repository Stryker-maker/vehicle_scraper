name: Apply Audit 11A Docs

on:
  pull_request:
    paths:
      - 'run_audit11a_docs.py'
      - 'apply_audit11a_docs.trigger'
      - '.github/workflows/apply-audit11a-docs.yml'

permissions:
  contents: write

jobs:
  apply:
    name: Apply Audit 11A authorities
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout Audit 11A branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ai/audit-11a-f150-manual-reintroduction

      - name: Set up Python 3.11.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.13'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install exact locked dependencies
        run: |
          python dependency_lock.py --lock requirements.lock
          python -m pip install --disable-pip-version-check pip==25.1.1
          python -m pip install --disable-pip-version-check --requirement requirements.lock
          python -m pip check

      - name: Apply authority updates
        run: python run_audit11a_docs.py

      - name: Validate complete repository
        run: |
          python -m unittest discover -s tests -p 'test*.py'
          git diff --check
          git diff --stat

      - name: Commit authorities to Audit 11A branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            README.md \
            docs/AUDIT_ROADMAP.md \
            docs/VEHICLE_PURPOSES.md \
            docs/REPOSITORY_BASELINE.md \
            docs/LIMITATIONS_REGISTER.md \
            tests/test_documentation_contract.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No Audit 11A authority changes to commit."
            exit 0
          fi
          git commit -m "Align authorities with manual F-150 cadence"
          git push origin HEAD:ai/audit-11a-f150-manual-reintroduction
