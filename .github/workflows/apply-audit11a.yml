name: Apply Audit 11A

on:
  pull_request:
    paths:
      - 'apply_audit11a.py'
      - '.github/workflows/apply-audit11a.yml'
      - 'vehicle_registry.json'

permissions:
  contents: write

jobs:
  apply:
    name: Apply F-150 manual cadence package
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout Audit 11A branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ai/audit-11a-f150-manual-reintroduction

      - name: Set up Python 3.11.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.13'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install exact locked dependencies
        run: |
          python dependency_lock.py --lock requirements.lock
          python -m pip install --disable-pip-version-check pip==25.1.1
          python -m pip install --disable-pip-version-check --requirement requirements.lock
          python -m pip check

      - name: Apply exact Audit 11A changes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apply_audit11a.py')
          text = path.read_text(encoding='utf-8')
          old = 'raise RuntimeError(f"Expected exactly one match in {path}: found {count}")'
          new = 'raise RuntimeError(f"Expected exactly one match in {path}: found {count}; anchor={old.splitlines()[0]!r}")'
          if text.count(old) != 1:
              raise RuntimeError('Unable to instrument Audit 11A applicator')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python apply_audit11a.py

      - name: Validate implementation and workflow
        run: |
          python -m py_compile vehicle_registry.py workflow_control.py phase1_pipeline.py storage_retention.py
          python vehicle_registry.py validate --registry vehicle_registry.json
          python vehicle_registry.py weekly-runs --registry vehicle_registry.json
          python vehicle_registry.py manual-runs --registry vehicle_registry.json
          python -m unittest discover -s tests -p 'test*.py'
          git diff --check
          git diff --stat

      - name: Export validated collection workflow
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validated-audit11a-scrape-${{ github.run_id }}
          path: .github/workflows/scrape.yml
          if-no-files-found: error
          retention-days: 3

      - name: Commit code and tests to Audit 11A branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            vehicle_registry.py \
            workflow_control.py \
            phase1_pipeline.py \
            storage_retention.py \
            tests/test_vehicle_registry.py \
            tests/test_workflow_hardening.py \
            tests/test_workflow_contract.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No Audit 11A code changes to commit."
            exit 0
          fi
          git commit -m "Operationalize manual F-150 cadence"
          git push origin HEAD:ai/audit-11a-f150-manual-reintroduction
