name: Archive pre-PR39 historical CSVs

on:
  push:
    branches:
      - ai/pr39-publication-hardening-20260928
    paths:
      - '.github/workflows/archive-historical-csvs.yml'
      - 'tools/archive_historical_csvs.py'

permissions:
  contents: write

concurrency:
  group: historical-csv-archive-pr39
  cancel-in-progress: false

jobs:
  archive:
    name: Build and publish historical CSV archive
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Build and verify archive
        run: |
          python tools/archive_historical_csvs.py \
            --base e1bd5a532588f55dfe2f88d7f4c069b67bd9444f \
            --head "$GITHUB_SHA" \
            --output archives/historical_csv_pre_pr39_2026-11-01.zip

      - name: Commit archive to PR branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archives/historical_csv_pre_pr39_2026-11-01.zip
          git diff --cached --check
          git commit -m "Archive pre-PR39 historical CSV data"
          git push origin "HEAD:${GITHUB_REF_NAME}"
