name: SonarQube Cloud

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'data/**'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'data/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: SonarQube Cloud analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # GitHub does not expose repository secrets to fork pull requests. Skip
    # those scans rather than producing an avoidable authentication failure.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up Python 3.11.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.13'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Verify exact dependency lock
        run: python dependency_lock.py --lock requirements.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check pip==25.1.1
          python -m pip install --disable-pip-version-check --requirement requirements.lock
          python -m pip check

      - name: Generate Python coverage report
        run: >-
          python -m coverage run --source=. -m unittest discover -s tests -v
          && python -m coverage xml -o coverage.xml
          && python -m coverage report

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
