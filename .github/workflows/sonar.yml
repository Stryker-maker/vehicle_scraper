name: SonarQube Cloud

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'data/**'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'data/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: SonarQube Cloud analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # GitHub does not expose repository secrets to fork pull requests. Skip
    # those scans rather than producing an avoidable authentication failure.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
