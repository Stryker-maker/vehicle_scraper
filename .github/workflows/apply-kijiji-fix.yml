name: Apply Kijiji Fix

on:
  push:
    branches: [ai/audit-10-purpose-outputs]
    paths:
      - 'apply_kijiji_fix.py'
      - '.github/workflows/apply-kijiji-fix.yml'
  pull_request:
    paths:
      - 'apply_kijiji_fix.py'
      - '.github/workflows/apply-kijiji-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    name: Apply fail-closed Kijiji correction
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout Audit 10 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ai/audit-10-purpose-outputs

      - name: Set up Python 3.11.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.13'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install exact locked dependencies
        run: |
          python dependency_lock.py --lock requirements.lock
          python -m pip install --disable-pip-version-check pip==25.1.1
          python -m pip install --disable-pip-version-check --requirement requirements.lock
          python -m pip check

      - name: Apply exact Kijiji corrections
        run: python apply_kijiji_fix.py

      - name: Validate modified Python and workflow
        run: |
          python -m py_compile kijiji_adapter.py kijiji_response_diagnostics.py
          python -m unittest discover -s tests -p 'test*.py'
          git diff --check
          git diff --stat

      - name: Commit corrections to Audit 10 branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kijiji_adapter.py kijiji_response_diagnostics.py tests/test_kijiji_structured_fields.py tests/test_kijiji_response_diagnostics.py .github/workflows/scrape.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No Kijiji correction changes to commit."
            exit 0
          fi
          git commit -m "Fix Kijiji structured fuel parsing and failure evidence"
          git push origin HEAD:ai/audit-10-purpose-outputs
