name: Kijiji Active Profile Validation

on:
  push:
    branches: [ai/audit-10-purpose-outputs]
    paths:
      - '.github/workflows/kijiji-matrix-validation.yml'
      - 'kijiji_adapter.py'
      - 'kijiji_run.py'
      - 'kijiji_response_diagnostics.py'
      - 'tests/test_kijiji_structured_fields.py'
      - 'tests/test_kijiji_response_diagnostics.py'
  pull_request:
    paths:
      - '.github/workflows/kijiji-matrix-validation.yml'
      - 'kijiji_adapter.py'
      - 'kijiji_run.py'
      - 'kijiji_response_diagnostics.py'
      - 'tests/test_kijiji_structured_fields.py'
      - 'tests/test_kijiji_response_diagnostics.py'

permissions:
  contents: read

jobs:
  validate:
    name: Kijiji ${{ matrix.vehicle_key }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - vehicle_key: ford_f350
            config: config_f350.json
            output_kind: buyer
          - vehicle_key: ram_3500
            config: config_ram3500.json
            output_kind: purpose
          - vehicle_key: subaru_forester
            config: config_forester.json
            output_kind: purpose
          - vehicle_key: honda_odyssey
            config: config_odyssey.json
            output_kind: purpose
          - vehicle_key: kia_carnival
            config: config_carnival.json
            output_kind: purpose
    steps:
      - name: Checkout Audit 10 ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python 3.11.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.13'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install exact locked dependencies
        run: |
          python dependency_lock.py --lock requirements.lock
          python -m pip install --disable-pip-version-check pip==25.1.1
          python -m pip install --disable-pip-version-check --requirement requirements.lock
          python -m pip check

      - name: Build governed single-pair plan
        run: |
          python vehicle_registry.py validate --registry vehicle_registry.json
          python workflow_control.py plan \
            --registry vehicle_registry.json \
            --scope single_pair \
            --vehicle-key '${{ matrix.vehicle_key }}' \
            --source kijiji \
            --output "$RUNNER_TEMP/source-plan.tsv"

      - name: Collect Kijiji with canonical and lifecycle evidence
        run: |
          python kijiji_run.py \
            --config '${{ matrix.config }}' \
            --timeout-seconds 3300 \
            --fail-on-unhealthy

      - name: Validate source and lifecycle evidence
        run: |
          python workflow_control.py validate-single-pair \
            --plan "$RUNNER_TEMP/source-plan.tsv" \
            --run-id "$GITHUB_RUN_ID"

      - name: Validate F-350 buyer output
        if: matrix.output_kind == 'buyer'
        run: |
          python f350_buyer_intelligence.py build \
            --config '${{ matrix.config }}' \
            --run-id "$GITHUB_RUN_ID" \
            --source kijiji \
            --overrides f350_owner_overrides.json
          python f350_buyer_validation.py \
            --config '${{ matrix.config }}' \
            --run-id "$GITHUB_RUN_ID" \
            --source kijiji

      - name: Validate secondary-purpose output
        if: matrix.output_kind == 'purpose'
        run: |
          python purpose_outputs.py build \
            --config '${{ matrix.config }}' \
            --run-id "$GITHUB_RUN_ID" \
            --source kijiji \
            --inputs purpose_inputs.json
          python purpose_output_validation.py \
            --config '${{ matrix.config }}' \
            --run-id "$GITHUB_RUN_ID" \
            --source kijiji \
            --inputs purpose_inputs.json

      - name: Prepare validation evidence
        if: always()
        run: |
          artifact="$RUNNER_TEMP/kijiji-${{ matrix.vehicle_key }}"
          mkdir -p "$artifact"
          if [[ -d 'data/${{ matrix.vehicle_key }}' ]]; then
            cp -R 'data/${{ matrix.vehicle_key }}/.' "$artifact/"
          fi
          cp "$RUNNER_TEMP/source-plan.tsv" "$artifact/source-plan.tsv"

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kijiji-${{ matrix.vehicle_key }}-${{ github.run_id }}
          path: ${{ runner.temp }}/kijiji-${{ matrix.vehicle_key }}
          if-no-files-found: error
          retention-days: 7
