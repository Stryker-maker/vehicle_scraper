name: Kijiji Response Diagnostic

on:
  push:
    branches: [ai/audit-10-purpose-outputs]
    paths:
      - '.github/workflows/kijiji-diagnostic.yml'
      - 'kijiji_probe.py'
      - 'tests/test_kijiji_probe.py'
  workflow_dispatch:
    inputs:
      vehicle_key:
        description: Active vehicle configuration to probe
        type: choice
        options: [ford_f350, ram_3500, subaru_forester, honda_odyssey, kia_carnival]
        default: honda_odyssey
        required: true

permissions:
  contents: read

jobs:
  probe:
    name: Capture Kijiji response evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VEHICLE_KEY: ${{ github.event_name == 'workflow_dispatch' && inputs.vehicle_key || 'honda_odyssey' }}
    steps:
      - name: Checkout diagnostic ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python 3.11.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.13'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install exact locked dependencies
        run: |
          python dependency_lock.py --lock requirements.lock
          python -m pip install --disable-pip-version-check pip==25.1.1
          python -m pip install --disable-pip-version-check --requirement requirements.lock
          python -m pip check

      - name: Resolve governed vehicle configuration
        id: config
        run: |
          case "$VEHICLE_KEY" in
            ford_f350) config=config_f350.json ;;
            ram_3500) config=config_ram3500.json ;;
            subaru_forester) config=config_forester.json ;;
            honda_odyssey) config=config_odyssey.json ;;
            kia_carnival) config=config_carnival.json ;;
            *) echo "Unsupported vehicle key: $VEHICLE_KEY" >&2; exit 1 ;;
          esac
          python vehicle_registry.py validate --registry vehicle_registry.json
          echo "path=$config" >> "$GITHUB_OUTPUT"

      - name: Capture Kijiji runner response
        run: |
          python kijiji_probe.py \
            --config "${{ steps.config.outputs.path }}" \
            --output-dir "$RUNNER_TEMP/kijiji-probe" \
            --timeout-seconds 30

      - name: Upload Kijiji diagnostic artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kijiji-response-diagnostic-${{ env.VEHICLE_KEY }}-${{ github.run_id }}
          path: ${{ runner.temp }}/kijiji-probe
          if-no-files-found: error
          retention-days: 7
