name: Apply Audit 11A Docs 2

on:
  pull_request:
    paths:
      - 'apply_audit11a_docs.py'
      - '.github/workflows/apply-audit11a-docs-2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ai/audit-11a-f150-manual-reintroduction

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.13'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: |
          python dependency_lock.py --lock requirements.lock
          python -m pip install --disable-pip-version-check pip==25.1.1
          python -m pip install --disable-pip-version-check --requirement requirements.lock
          python -m pip check

      - name: Correct applicator anchors and apply
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apply_audit11a_docs.py')
          text = path.read_text(encoding='utf-8')

          fragment = 'Do not use `data/<vehicle>/merged/*.csv` as current recommendations.\n\'\'\','
          replacement = 'Do not use `data/<vehicle>/merged/*.csv` as current recommendations. Historical merged CSVs are disabled legacy output and are deleted for active vehicles by governed retention with SHA-256 deletion evidence.\n\'\'\','
          if text.count(fragment) != 2:
              raise RuntimeError(f'Unexpected README fragment count: {text.count(fragment)}')
          text = text.replace(fragment, replacement)

          anchor = '    path.write_text(text.replace(old, new), encoding="utf-8")\n\n\nreadme = ROOT / "README.md"'
          helper = '''    path.write_text(text.replace(old, new), encoding="utf-8")


def replace_first(path: Path, old: str, new: str) -> None:
    text = path.read_text(encoding="utf-8")
    if old not in text:
        raise RuntimeError(f"Missing anchor in {path}: {old.splitlines()[0]!r}")
    path.write_text(text.replace(old, new, 1), encoding="utf-8")


readme = ROOT / "README.md"'''
          if text.count(anchor) != 1:
              raise RuntimeError(f'Unexpected helper anchor count: {text.count(anchor)}')
          text = text.replace(anchor, helper)

          call = '''replace_once(
    test,
    '            "AUDIT_10_SECONDARY_PURPOSE_OUTPUTS.md",\\n',
    '            "AUDIT_10_SECONDARY_PURPOSE_OUTPUTS.md",\\n            "AUDIT_11A_F150_MANUAL_REINTRODUCTION.md",\\n',
)'''
          fixed_call = '''replace_first(
    test,
    '            "AUDIT_09_F350_BUYER_INTELLIGENCE.md",\\n            "AUDIT_10_SECONDARY_PURPOSE_OUTPUTS.md",\\n',
    '            "AUDIT_09_F350_BUYER_INTELLIGENCE.md",\\n            "AUDIT_10_SECONDARY_PURPOSE_OUTPUTS.md",\\n            "AUDIT_11A_F150_MANUAL_REINTRODUCTION.md",\\n',
)'''
          if text.count(call) != 1:
              raise RuntimeError(f'Unexpected authority call count: {text.count(call)}')
          path.write_text(text.replace(call, fixed_call), encoding='utf-8')
          PY
          python apply_audit11a_docs.py

      - name: Validate repository
        run: |
          python -m unittest discover -s tests -p 'test*.py'
          git diff --check

      - name: Commit authority updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md docs/AUDIT_ROADMAP.md docs/VEHICLE_PURPOSES.md docs/REPOSITORY_BASELINE.md docs/LIMITATIONS_REGISTER.md tests/test_documentation_contract.py
          git diff --cached --check
          git commit -m "Align authorities with manual F-150 cadence"
          git push origin HEAD:ai/audit-11a-f150-manual-reintroduction
