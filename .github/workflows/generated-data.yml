name: Generated Data Validation

on:
  pull_request:
    paths:
      - 'data/**'

permissions:
  contents: read

concurrency:
  group: generated-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate governed generated-data diff
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout pull-request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python 3.11.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.13'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: |
          python dependency_lock.py --lock requirements.lock
          python -m pip install --disable-pip-version-check pip==25.1.1
          python -m pip install --disable-pip-version-check --requirement requirements.lock
          python -m pip check

      - name: Capture generated-data paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only --diff-filter=ACDMRTUXB "$BASE_SHA" "$HEAD_SHA" -- data/ > "$RUNNER_TEMP/generated-data-paths.txt"
          test -s "$RUNNER_TEMP/generated-data-paths.txt"
          cat "$RUNNER_TEMP/generated-data-paths.txt"

      - name: Validate generated-data integrity and retention
        id: generated-data-validation
        run: |
          set +e
          python generated_data_validation.py \
            --paths-file "$RUNNER_TEMP/generated-data-paths.txt" \
            --registry vehicle_registry.json \
            > "$RUNNER_TEMP/generated-data-validation.json" 2>&1
          status=$?
          cat "$RUNNER_TEMP/generated-data-validation.json"
          exit "$status"

      - name: Upload failed generated-data validation
        if: failure() && steps.generated-data-validation.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: generated-data-validation-failure-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/generated-data-paths.txt
            ${{ runner.temp }}/generated-data-validation.json
          if-no-files-found: error
          retention-days: 3
