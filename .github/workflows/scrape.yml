name: Weekly Vehicle Scrape

on:
  pull_request:
  schedule:
    # Every Monday at 8:00 AM UTC (2:00 AM MDT)
    - cron: '0 8 * * 1'
  workflow_dispatch:

concurrency:
  group: vehicle-scrape-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Phase 1 tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile Python sources
        run: python -m py_compile phase1_pipeline.py scraper.py kijiji_scraper.py merge.py

      - name: Run structured tests
        run: python -m unittest discover -s tests -v

  scrape:
    name: Collect vehicle data
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install collector dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 geopy

      - name: Collect AutoTrader and Kijiji data with status evidence
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
        run: |
          configs=(
            config_f350.json
            config_f150.json
            config_ram3500.json
            config_tundra.json
            config_forester.json
            config_odyssey.json
            config_carnival.json
          )

          for config in "${configs[@]}"; do
            python phase1_pipeline.py run-source \
              --source autotrader \
              --config "$config" \
              -- python scraper.py --config "$config"
          done

          for config in "${configs[@]}"; do
            python phase1_pipeline.py run-source \
              --source kijiji \
              --config "$config" \
              -- python kijiji_scraper.py --config "$config"
          done

      - name: Build unranked manual-review files
        run: |
          python phase1_pipeline.py build-manual-review --configs \
            config_f350.json \
            config_f150.json \
            config_ram3500.json \
            config_tundra.json \
            config_forester.json \
            config_odyssey.json \
            config_carnival.json

      - name: Write consolidated run-health report
        run: |
          python phase1_pipeline.py report-health --configs \
            config_f350.json \
            config_f150.json \
            config_ram3500.json \
            config_tundra.json \
            config_forester.json \
            config_odyssey.json \
            config_carnival.json
          cat data/run_status/latest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push collected data and evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Source scrapers may alter config files, but Phase 1 does not persist
          # automatic search-policy changes. Only collected data and evidence are committed.
          git add data/
          git diff --staged --quiet || git commit -m "Weekly scrape $(date +'%Y-%m-%d')"
          git push

      - name: Fail visibly when any expected source run is unhealthy
        run: python phase1_pipeline.py check-health
