name: Weekly Vehicle Scrape

on:
  schedule:
    # Every Monday at 8:00 AM UTC (2:00 AM MDT)
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 geopy

      # ── AutoTrader ──────────────────────────────────────────────────────

      - name: AutoTrader — Ford F-350
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
        run: python scraper.py --config config_f350.json
        continue-on-error: true

      - name: AutoTrader — Ford F-150
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
        run: python scraper.py --config config_f150.json
        continue-on-error: true

      - name: AutoTrader — RAM 3500
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
        run: python scraper.py --config config_ram3500.json
        continue-on-error: true

      - name: AutoTrader — Toyota Tundra Hybrid
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
        run: python scraper.py --config config_tundra.json
        continue-on-error: true

      - name: AutoTrader — Subaru Forester
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
        run: python scraper.py --config config_forester.json
        continue-on-error: true
 
      - name: AutoTrader — Honda Odyssey
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
        run: python scraper.py --config config_odyssey.json
        continue-on-error: true

      - name: AutoTrader — Kia Carnival
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
        run: python scraper.py --config config_carnival.json
        continue-on-error: true
        
      # ── Kijiji ──────────────────────────────────────────────────────────

      - name: Kijiji — Ford F-350
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
        run: python kijiji_scraper.py --config config_f350.json
        continue-on-error: true

      - name: Kijiji — Ford F-150
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
        run: python kijiji_scraper.py --config config_f150.json
        continue-on-error: true

      - name: Kijiji — RAM 3500
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
        run: python kijiji_scraper.py --config config_ram3500.json
        continue-on-error: true

      - name: Kijiji — Toyota Tundra Hybrid
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
        run: python kijiji_scraper.py --config config_tundra.json
        continue-on-error: true

      - name: Kijiji — Subaru Forester
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
        run: python kijiji_scraper.py --config config_forester.json
        continue-on-error: true

      - name: Kijiji — Honda Odyssey
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
        run: python kijiji_scraper.py --config config_odyssey.json
        continue-on-error: true

      - name: Kijiji — Kia Carnival
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
        run: python kijiji_scraper.py --config config_carnival.json
        continue-on-error: true

      # ── Merge ────────────────────────────────────────────────────────────

      - name: Merge — Ford F-350
        run: python merge.py --config config_f350.json
        continue-on-error: true

      - name: Merge — Ford F-150
        run: python merge.py --config config_f150.json
        continue-on-error: true

      - name: Merge — RAM 3500
        run: python merge.py --config config_ram3500.json
        continue-on-error: true

      - name: Merge — Toyota Tundra Hybrid
        run: python merge.py --config config_tundra.json
        continue-on-error: true

      - name: Merge — Subaru Forester
        run: python merge.py --config config_forester.json
        continue-on-error: true

      - name: Merge — Honda Odyssey
        run: python merge.py --config config_odyssey.json
        continue-on-error: true

      - name: Merge — Kia Carnival
        run: python merge.py --config config_carnival.json
        continue-on-error: true

      # ── Commit results ───────────────────────────────────────────────────

      - name: Commit and push all results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ config_*.json
          git diff --staged --quiet || git commit -m "Weekly scrape $(date +'%Y-%m-%d')"
          git push 