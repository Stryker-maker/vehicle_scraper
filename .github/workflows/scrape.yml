name: Weekly AutoTrader Scrape

on:
  schedule:
    # Runs every Monday at 8:00 AM UTC (2:00 AM MDT / 1:00 AM MST)
    - cron: '0 8 * * 1'
  workflow_dispatch: # Allows manual trigger from GitHub web UI or mobile app

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to commit CSV results back to repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 geopy

      - name: Run scraper
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
        run: python scraper.py

      - name: Commit and push CSV results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.csv
          git diff --staged --quiet || git commit -m "Scrape results $(date +'%Y-%m-%d')"
          git push
