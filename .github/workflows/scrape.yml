name: Weekly Vehicle Scrape

on:
  pull_request:
  schedule:
    # Every Monday at 8:00 AM UTC (2:00 AM MDT)
    - cron: '0 8 * * 1'
  workflow_dispatch:

concurrency:
  group: vehicle-scrape-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acknowledge-generated-data:
    name: Acknowledge generated data
    if: github.event_name == 'pull_request' && github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Confirm generated-data update
        run: echo "Generated data commit acknowledged; code tests already passed before collection."

  test:
    name: Repository tests
    if: "!(github.event_name == 'pull_request' && github.actor == 'github-actions[bot]')"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile Python sources
        run: >-
          python -m py_compile
          vehicle_registry.py
          phase1_common.py
          phase1_kijiji_runner.py
          phase1_runtime.py
          phase1_reporting.py
          phase1_pipeline.py
          scraper.py
          kijiji_scraper.py
          merge.py

      - name: Validate active vehicle registry
        run: python vehicle_registry.py validate --registry vehicle_registry.json

      - name: Run structured tests
        run: python -m unittest discover -s tests -v

  scrape:
    name: Collect vehicle data
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install collector dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 geopy

      - name: Validate active vehicle registry
        run: |
          python vehicle_registry.py validate --registry vehicle_registry.json
          python vehicle_registry.py summary --registry vehicle_registry.json

      - name: Collect uncapped AutoTrader and Kijiji data with status evidence
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
        run: |
          set -euo pipefail
          active_configs="$(python vehicle_registry.py active-configs --registry vehicle_registry.json)"
          mapfile -t configs <<< "$active_configs"

          for config in "${configs[@]}"; do
            python phase1_pipeline.py run-source \
              --source autotrader \
              --config "$config" \
              --timeout-seconds 4500 \
              -- python scraper.py --config "$config"
          done

          for config in "${configs[@]}"; do
            python phase1_pipeline.py run-source \
              --source kijiji \
              --config "$config" \
              --timeout-seconds 4500 \
              -- python phase1_kijiji_runner.py --config "$config"
          done

      - name: Build unranked manual-review files
        run: |
          set -euo pipefail
          active_configs="$(python vehicle_registry.py active-configs --registry vehicle_registry.json)"
          mapfile -t configs <<< "$active_configs"
          python phase1_pipeline.py build-manual-review --configs "${configs[@]}"

      - name: Write consolidated run-health report
        run: |
          set -euo pipefail
          active_configs="$(python vehicle_registry.py active-configs --registry vehicle_registry.json)"
          mapfile -t configs <<< "$active_configs"
          python phase1_pipeline.py report-health --configs "${configs[@]}"
          cat data/run_status/latest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push collected data and evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Collectors run against temporary uncapped configs. Approved repository
          # configuration remains unchanged; only active-scope data and evidence are committed.
          git add data/
          git diff --staged --quiet || git commit -m "Weekly scrape $(date +'%Y-%m-%d')"
          git push

      - name: Fail visibly when any expected source run is unhealthy
        run: python phase1_pipeline.py check-health
