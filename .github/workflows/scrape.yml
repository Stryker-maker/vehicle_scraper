name: Governed Vehicle Collection

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      collection_scope:
        description: Governed collection scope
        type: choice
        options: [full, single_pair]
        default: full
        required: true
      vehicle_key:
        description: Active vehicle for single-pair validation
        type: choice
        options: [ford_f350, ram_3500, subaru_forester, honda_odyssey, kia_carnival, ford_f150]
        default: ford_f350
        required: true
      source:
        description: Source for single-pair validation
        type: choice
        options: [autotrader, kijiji]
        default: autotrader
        required: true
      publish_generated_data:
        description: Publish governed data from a manual full run
        type: boolean
        default: false
        required: true
      anomaly_policy:
        description: Critical anomaly handling for a manual full run
        type: choice
        options: [enforce, report_only]
        default: enforce
        required: true
      operator_note:
        description: Optional reason or context for the manual run
        type: string
        default: ''
        required: false

permissions:
  contents: write

concurrency:
  group: governed-collection-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Deterministic CI preflight
    uses: ./.github/workflows/ci.yml

  collect:
    name: Collect governed vehicle data
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      COLLECTION_SCOPE: ${{ github.event_name == 'schedule' && 'full' || inputs.collection_scope }}
      VEHICLE_KEY: ${{ github.event_name == 'schedule' && 'ford_f350' || inputs.vehicle_key }}
      SELECTED_SOURCE: ${{ github.event_name == 'schedule' && 'autotrader' || inputs.source }}
      PUBLISH_GENERATED_DATA: ${{ github.event_name == 'schedule' && 'true' || inputs.publish_generated_data }}
      ANOMALY_POLICY: ${{ github.event_name == 'schedule' && 'enforce' || inputs.anomaly_policy }}
      OPERATOR_NOTE: ${{ inputs.operator_note || '' }}
    steps:
      - name: Checkout collection ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python 3.11.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.13'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked collector dependencies
        run: |
          python dependency_lock.py --lock requirements.lock
          python -m pip install --disable-pip-version-check pip==25.1.1
          python -m pip install --disable-pip-version-check --requirement requirements.lock
          python -m pip check

      - name: Validate governed vehicle registry and configurations
        run: |
          python vehicle_registry.py validate --registry vehicle_registry.json
          python vehicle_registry.py summary --registry vehicle_registry.json

      - name: Build governed collection plan
        id: collection-plan
        run: |
          plan="$RUNNER_TEMP/source-plan.tsv"
          python workflow_control.py plan \
            --registry vehicle_registry.json \
            --scope "$COLLECTION_SCOPE" \
            --vehicle-key "$VEHICLE_KEY" \
            --source "$SELECTED_SOURCE" \
            --output "$plan"
          echo "path=$plan" >> "$GITHUB_OUTPUT"

      - name: Collect source data with canonical and lifecycle evidence
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r config source; do
            extra=()
            if [[ "$COLLECTION_SCOPE" == "single_pair" ]]; then
              extra+=(--fail-on-unhealthy)
            fi
            case "$source" in
              autotrader)
                python autotrader_run.py --config "$config" --timeout-seconds 4500 "${extra[@]}"
                ;;
              kijiji)
                python kijiji_run.py --config "$config" --timeout-seconds 4500 "${extra[@]}"
                ;;
              *)
                echo "Unsupported source in collection plan: $source" >&2
                exit 1
                ;;
            esac
          done < "${{ steps.collection-plan.outputs.path }}"

      - name: Validate single-pair source and lifecycle evidence
        if: env.COLLECTION_SCOPE == 'single_pair'
        run: |
          python workflow_control.py validate-single-pair \
            --plan "${{ steps.collection-plan.outputs.path }}" \
            --run-id "$GITHUB_RUN_ID"

      - name: Build and validate F-350 buyer intelligence for narrow validation
        if: env.COLLECTION_SCOPE == 'single_pair' && env.VEHICLE_KEY == 'ford_f350'
        run: |
          python f350_buyer_intelligence.py build \
            --config config_f350.json \
            --run-id "$GITHUB_RUN_ID" \
            --source "$SELECTED_SOURCE" \
            --overrides f350_owner_overrides.json
          python f350_buyer_validation.py \
            --config config_f350.json \
            --run-id "$GITHUB_RUN_ID" \
            --source "$SELECTED_SOURCE"
          cat data/ford_f350/buyer_intelligence/market_summary_latest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build and validate secondary-purpose output for narrow validation
        if: env.COLLECTION_SCOPE == 'single_pair' && env.VEHICLE_KEY != 'ford_f350' && env.VEHICLE_KEY != 'ford_f150' && env.VEHICLE_KEY != 'toyota_tundra'
        run: |
          set -euo pipefail
          config=$(cut -f1 "${{ steps.collection-plan.outputs.path }}")
          python purpose_outputs.py build \
            --config "$config" \
            --run-id "$GITHUB_RUN_ID" \
            --source "$SELECTED_SOURCE" \
            --inputs purpose_inputs.json
          python purpose_output_validation.py \
            --config "$config" \
            --run-id "$GITHUB_RUN_ID" \
            --source "$SELECTED_SOURCE" \
            --inputs purpose_inputs.json
          find "data/$VEHICLE_KEY/purpose_output" -name '*_latest.md' -type f -print -exec cat {} \; >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare single-pair validation artifact
        if: always() && env.COLLECTION_SCOPE == 'single_pair'
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/smoke-artifact"
          rm -rf "$artifact"
          mkdir -p "$artifact"
          copy_file() {
            local source="$1" destination="$2"
            if [[ -f "$source" ]]; then
              mkdir -p "$destination"
              cp "$source" "$destination/"
            fi
          }
          copy_dir() {
            local source="$1" destination="$2"
            if [[ -d "$source" ]]; then
              mkdir -p "$destination"
              cp -R "$source/." "$destination/"
            fi
          }
          copy_file "data/$VEHICLE_KEY/run_status/${SELECTED_SOURCE}_latest.json" "$artifact/run_status"
          copy_file "data/$VEHICLE_KEY/latest/${VEHICLE_KEY}_${SELECTED_SOURCE}_latest.csv" "$artifact/latest"
          copy_dir "data/$VEHICLE_KEY/evidence/$SELECTED_SOURCE" "$artifact/evidence"
          copy_dir "data/$VEHICLE_KEY/adapter_evidence/$SELECTED_SOURCE" "$artifact/adapter_evidence"
          copy_dir "data/$VEHICLE_KEY/identity_lifecycle/$SELECTED_SOURCE" "$artifact/identity_lifecycle"
          copy_dir "data/$VEHICLE_KEY/buyer_intelligence" "$artifact/buyer_intelligence"
          copy_dir "data/$VEHICLE_KEY/purpose_output" "$artifact/purpose_output"
          cp "${{ steps.collection-plan.outputs.path }}" "$artifact/source-plan.tsv"
          find "$artifact" -type f -maxdepth 8 -print | sort

      - name: Upload single-pair validation artifact
        if: always() && env.COLLECTION_SCOPE == 'single_pair'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-smoke-${{ env.VEHICLE_KEY }}-${{ env.SELECTED_SOURCE }}-${{ github.run_id }}
          path: ${{ runner.temp }}/smoke-artifact
          if-no-files-found: error
          retention-days: 7

      - name: Build evidence-backed manual-review files
        if: env.COLLECTION_SCOPE == 'full'
        run: python phase1_pipeline.py build-manual-review --registry vehicle_registry.json

      - name: Write consolidated reconciliation and run-health report
        if: env.COLLECTION_SCOPE == 'full'
        run: |
          python phase1_pipeline.py report-health --registry vehicle_registry.json
          cat data/run_status/latest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Discover compatible historical health baseline
        id: baseline
        if: env.COLLECTION_SCOPE == 'full'
        run: |
          baseline="$RUNNER_TEMP/baseline-health.json"
          python baseline_history.py \
            --current data/run_status/latest.json \
            --output "$baseline" \
            --history-limit 50
          echo "path=$baseline" >> "$GITHUB_OUTPUT"
          echo "Selected historical baseline:" \
            "$(python -c 'import json,sys; print(json.load(open(sys.argv[1])).get("run_id") or "none")' "$baseline")"

      - name: Build baseline-aware anomaly report
        if: env.COLLECTION_SCOPE == 'full'
        run: |
          python workflow_anomalies.py build \
            --baseline "${{ steps.baseline.outputs.path }}" \
            --current data/run_status/latest.json \
            --run-id "$GITHUB_RUN_ID"
          cat data/run_status/anomalies_latest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Fail visibly on unhealthy source evidence
        if: env.COLLECTION_SCOPE == 'full'
        run: python phase1_pipeline.py check-health

      - name: Build and validate transparent F-350 buyer intelligence
        if: env.COLLECTION_SCOPE == 'full'
        run: |
          python f350_buyer_intelligence.py build \
            --config config_f350.json \
            --run-id "$GITHUB_RUN_ID" \
            --overrides f350_owner_overrides.json
          python f350_buyer_validation.py \
            --config config_f350.json \
            --run-id "$GITHUB_RUN_ID" \
            --source autotrader \
            --source kijiji
          cat data/ford_f350/buyer_intelligence/market_summary_latest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build and validate secondary-purpose outputs
        if: env.COLLECTION_SCOPE == 'full'
        run: |
          set -euo pipefail
          for config in config_ram3500.json config_forester.json config_odyssey.json config_carnival.json; do
            python purpose_outputs.py build \
              --config "$config" \
              --run-id "$GITHUB_RUN_ID" \
              --source autotrader \
              --source kijiji \
              --inputs purpose_inputs.json
            python purpose_output_validation.py \
              --config "$config" \
              --run-id "$GITHUB_RUN_ID" \
              --source autotrader \
              --source kijiji \
              --inputs purpose_inputs.json
          done
          find data/ram_3500/purpose_output data/subaru_forester/purpose_output data/honda_odyssey/purpose_output data/kia_carnival/purpose_output \
            -name '*_latest.md' -type f -print -exec cat {} \; >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce critical anomaly policy
        if: env.COLLECTION_SCOPE == 'full'
        run: |
          python workflow_anomalies.py check \
            --report data/run_status/anomalies_latest.json \
            --policy "$ANOMALY_POLICY"

      - name: Apply and verify bounded storage retention
        if: env.COLLECTION_SCOPE == 'full'
        run: |
          python storage_retention.py apply --registry vehicle_registry.json
          python storage_retention.py verify --registry vehicle_registry.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          report = json.loads(Path('data/retention/latest.json').read_text())
          print('## Storage retention')
          print(f"- Status: {report['verification_status']}")
          print(f"- Managed files: {report['managed_file_count']}")
          print(f"- Managed bytes: {report['managed_bytes']}")
          print(f"- Deleted this run: {report['deleted_file_count']} files / {report['deleted_bytes']} bytes")
          PY

      - name: Upload full-run diagnostics
        if: always() && env.COLLECTION_SCOPE == 'full'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-run-diagnostics-${{ github.run_id }}
          path: |
            data/run_status/
            data/retention/
            data/ford_f350/buyer_intelligence/
            data/ram_3500/purpose_output/
            data/subaru_forester/purpose_output/
            data/honda_odyssey/purpose_output/
            data/kia_carnival/purpose_output/
            ${{ steps.collection-plan.outputs.path }}
          if-no-files-found: warn
          retention-days: 14

      - name: Commit and push governed generated data
        if: env.COLLECTION_SCOPE == 'full' && env.PUBLISH_GENERATED_DATA == 'true'
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = "branch"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          python storage_retention.py validate-staged --registry vehicle_registry.json
          if git diff --staged --quiet; then
            echo "No governed generated-data changes to publish."
            exit 0
          fi
          python generated_data_publish.py prepare \
            --registry vehicle_registry.json \
            --run-id "$GITHUB_RUN_ID" \
            --source-sha "$GITHUB_SHA" \
            --event-name "$GITHUB_EVENT_NAME" \
            --ref-name "$GITHUB_REF_NAME"
          git add data/run_status/publication_latest.json
          python storage_retention.py validate-staged --registry vehicle_registry.json
          python generated_data_publish.py verify-staged --registry vehicle_registry.json
          git diff --cached --check
          git diff --cached --name-status
          git diff --cached --stat
          git fetch origin "$GITHUB_REF_NAME"
          remote_sha=$(git rev-parse "origin/$GITHUB_REF_NAME")
          if [[ "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo "Remote ref changed during collection: expected $GITHUB_SHA, found $remote_sha" >&2
            exit 1
          fi
          git commit -m "Vehicle data run $GITHUB_RUN_ID $(date -u +'%Y-%m-%d')"
          git push origin "HEAD:$GITHUB_REF_NAME"
