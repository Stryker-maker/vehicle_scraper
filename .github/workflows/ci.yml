name: Repository CI

on:
  pull_request:
    paths-ignore:
      - 'data/**'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Deterministic repository tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python 3.11.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.13'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Verify exact dependency lock
        run: python dependency_lock.py --lock requirements.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check pip==25.1.1
          python -m pip install --disable-pip-version-check --requirement requirements.lock
          python -m pip check
          python -m pip freeze --all | sort

      - name: Compile Python sources
        run: >-
          python -m py_compile
          vehicle_config.py
          vehicle_registry.py
          phase1_common.py
          canonical_evidence.py
          identity_lifecycle.py
          storage_retention.py
          dependency_lock.py
          workflow_control.py
          workflow_anomalies.py
          generated_data_publish.py
          generated_data_validation.py
          autotrader_distance.py
          autotrader_history.py
          autotrader_adapter.py
          autotrader_canonical.py
          autotrader_run.py
          kijiji_locations.py
          kijiji_history.py
          kijiji_adapter.py
          kijiji_canonical.py
          kijiji_run.py
          f350_buyer_intelligence.py
          f350_buyer_validation.py
          phase1_runtime.py
          phase1_reporting.py
          phase1_pipeline.py
          scraper.py
          kijiji_scraper.py
          merge.py

      - name: Validate governed vehicle registry and configurations
        run: python vehicle_registry.py validate --registry vehicle_registry.json

      - name: Run structured and hostile tests
        id: structured-tests
        run: |
          set +e
          python -m unittest discover -s tests -v > "$RUNNER_TEMP/structured-tests.txt" 2>&1
          status=$?
          cat "$RUNNER_TEMP/structured-tests.txt"
          exit "$status"

      - name: Upload failed structured-test log
        if: failure() && steps.structured-tests.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: structured-test-failure-${{ github.run_id }}
          path: ${{ runner.temp }}/structured-tests.txt
          if-no-files-found: error
          retention-days: 3
