name: Repository CI

on:
  push:
    branches: [ai/audit-11a-f150-manual-reintroduction]
    paths:
      - '.github/workflows/ci.yml'
      - 'audit11a_live_validation.py'
  pull_request:
    paths-ignore:
      - 'data/**'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Deterministic repository tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python 3.11.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.13'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Verify exact dependency lock
        run: python dependency_lock.py --lock requirements.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check pip==25.1.1
          python -m pip install --disable-pip-version-check --requirement requirements.lock
          python -m pip check
          python -m pip freeze --all | sort

      - name: Compile Python sources
        run: >-
          python -m py_compile
          vehicle_config.py
          vehicle_registry.py
          phase1_common.py
          canonical_evidence.py
          identity_lifecycle.py
          storage_retention.py
          dependency_lock.py
          workflow_control.py
          workflow_anomalies.py
          generated_data_publish.py
          generated_data_validation.py
          autotrader_distance.py
          autotrader_history.py
          autotrader_adapter.py
          autotrader_canonical.py
          autotrader_run.py
          kijiji_locations.py
          kijiji_history.py
          kijiji_adapter.py
          kijiji_canonical.py
          kijiji_run.py
          f350_buyer_intelligence.py
          f350_buyer_validation.py
          purpose_outputs.py
          purpose_output_validation.py
          phase1_runtime.py
          phase1_reporting.py
          phase1_pipeline.py
          scraper.py
          kijiji_scraper.py
          merge.py

      - name: Validate governed vehicle registry and configurations
        run: python vehicle_registry.py validate --registry vehicle_registry.json

      - name: Run structured and hostile tests
        id: structured-tests
        run: |
          set +e
          python -m unittest discover -s tests -v > "$RUNNER_TEMP/structured-tests.txt" 2>&1
          status=$?
          cat "$RUNNER_TEMP/structured-tests.txt"
          exit "$status"

      - name: Upload failed structured-test log
        if: failure() && steps.structured-tests.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: structured-test-failure-${{ github.run_id }}
          path: ${{ runner.temp }}/structured-tests.txt
          if-no-files-found: error
          retention-days: 3

  audit11a-f150-live:
    if: >-
      github.ref_name == 'ai/audit-11a-f150-manual-reintroduction' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    name: Audit 11A F-150 live validation
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout Audit 11A branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python 3.11.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.13'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install exact locked dependencies
        run: |
          python dependency_lock.py --lock requirements.lock
          python -m pip install --disable-pip-version-check pip==25.1.1
          python -m pip install --disable-pip-version-check --requirement requirements.lock
          python -m pip check

      - name: Collect and validate both F-150 sources
        id: live-validation
        continue-on-error: true
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
        run: python audit11a_live_validation.py

      - name: Upload F-150 live validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audit11a-f150-live-${{ github.run_id }}
          path: |
            AUDIT_11A_F150_LIVE_VALIDATION_RESULT.json
            data/ford_f150/
            ${{ runner.temp }}/*.tsv
          if-no-files-found: warn
          retention-days: 7

      - name: Commit temporary validation result
        if: always()
        run: |
          set -euo pipefail
          test -f AUDIT_11A_F150_LIVE_VALIDATION_RESULT.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add AUDIT_11A_F150_LIVE_VALIDATION_RESULT.json
          test "$(git diff --cached --name-only)" = "AUDIT_11A_F150_LIVE_VALIDATION_RESULT.json"
          git diff --cached --check
          git fetch origin "$GITHUB_REF_NAME"
          remote_sha=$(git rev-parse "origin/$GITHUB_REF_NAME")
          if [[ "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo "Remote branch changed during validation: expected $GITHUB_SHA, found $remote_sha" >&2
            exit 1
          fi
          git commit -m "Record temporary Audit 11A F-150 live validation"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Enforce live validation success
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('AUDIT_11A_F150_LIVE_VALIDATION_RESULT.json').read_text())
          if result['validation_status'] != 'success':
              raise SystemExit('Audit 11A live validation failed; inspect committed result JSON')
          PY
